kind = "web"
previewPath = "/"
title = "Quick Pass Emissions OS"
description = "Quick Pass Business OS: operational responsibilities, payroll preparation, inventory, maintenance, dealership billing, finance, owner summaries and internal reminders."
version = "1.0.0"
id = "artifacts/quick-pass-emissions-os"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api/auth", "/api/sign-in", "/api/jobs", "/api/payroll", "/api/finance", "/api/reports", "/api/performance", "/api/notifications", "/_next/hmr" ]
localPort = 24786

[services.development]
run = "pnpm --filter @workspace/quick-pass-emissions-os run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/quick-pass-emissions-os", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/quick-pass-emissions-os", "run", "start"]

[services.production.run.env]
PORT = "24786"
NODE_ENV = "production"

[services.env]
PORT = "24786"
BASE_PATH = "/"

[services.health.startup]
path = "/healthz"
