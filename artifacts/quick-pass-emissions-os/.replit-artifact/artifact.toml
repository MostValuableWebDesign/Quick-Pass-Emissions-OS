kind = "web"
previewPath = "/"
title = "Quick Pass Emissions OS"
description = "Quick Pass Business OS: workforce operations, payroll, inventory, maintenance, dealership billing and operational finance. Imports the Phases 1–4 GitHub application into the shared Replit workspace."
version = "1.0.0"
id = "artifacts/quick-pass-emissions-os"
router = "path"

[[services]]
name = "web"
paths = [ "/", "/api/auth", "/api/sign-in", "/api/jobs", "/api/payroll", "/api/finance", "/_next/hmr" ]
localPort = 24786

[services.development]
run = "pnpm --filter @workspace/quick-pass-emissions-os run dev"

[services.production.build]
args = ["pnpm", "--filter", "@workspace/quick-pass-emissions-os", "run", "build"]

[services.production.build.env]
NODE_ENV = "production"

[services.production.run]
args = ["pnpm", "--filter", "@workspace/quick-pass-emissions-os", "run", "start"]

[services.production.run.env]
PORT = "24786"
NODE_ENV = "production"

[services.env]
PORT = "24786"
BASE_PATH = "/"
